kind = "web"
previewPath = "/"
title = "Crown & Blade"
description = "A polished Cape Town barber shop website with service discovery, database-backed booking, availability, contact enquiries, promotion handling, and calendar export."
version = "1.0.0"
id = "artifacts/crown-blade"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19847

[services.development]
run = "pnpm --filter @workspace/crown-blade run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crown-blade", "run", "build" ]
serve = "static"
publicDir = "artifacts/crown-blade/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19847"
BASE_PATH = "/"
