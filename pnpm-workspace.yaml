# Wait one day before accepting newly published package versions. This reduces
# exposure to compromised releases while preserving reproducible lockfile installs.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*

catalog:
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit depends on the older esbuild-kit loader; keep its runtime patched.
  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  esbuild: '0.28.2'
  # orval pins an older js-yaml release; require the security-fixed version.
  js-yaml: '4.3.2'
